<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>Did Not Get It - Skip opening rejection letters</title>
	</head>
	<body class="flex column">
		<article class="flex column">
			<header><h1>Customize Your Rejection</h1></header>

			<form
				id="settings-form"
				class="grid w-100">
				<div class="input-area flex column">
					<label
						id="tag-label"
						for="tag-input"
						class="flex row align-center"
						style="gap: 6px">
						<span>Rejection Label</span>
					</label>
					<input
						type="text"
						id="tag-input"
						placeholder="Insert something humorous here..."
						maxlength="30" />
				</div>
				<div class="form-actions flex row">
					<button
						id="save-btn"
						class="flex row align-center h-fit"
						type="submit">
						<span id="save-btn-text">Save</span>
					</button>
				</div>
			</form>

			<div class="scoreboard flex column full-center">
				<span id="rejection-counter" class="text-family-bold">0</span>
				<span>Time-wasting emails skipped</span>
			</div>

			<h2 id="platform-status">Checking platform...</h2>

			<span>Did Not Get It 1.0</span>
		</article>

		<script
			type="module"
			src="./main.ts"></script>
	</body>
</html>
